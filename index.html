<style>
/* Layout: sidebar a sinistra su desktop, barra di navigazione in basso su telefono; contenuto a griglia di pannelli sobri. */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F1EEEA; --line:#E7E3DD; --fg:#2F2C33; --muted:#7B7581;
  --accent:#4F6475; --accent-soft:#E8EEF2; --on-accent:#FFFFFF;
  --pos:#5E7A56; --neg:#9E5F5F; --warn:#9A7A34; --pos-soft:#EEF4EA; --neg-soft:#F7EDED; --warn-soft:#F8F2E2;
  --f-display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --bar:#738FA3; --bar-ok:#9EB9C9; --bar-near:#D4AE5A; --bar-over:#C29595;
  --chart-in:#A9C19D; --chart-out:#9EB9C9; --chart-over:#D9B8B8;
  --r:14px; --shadow:0 1px 2px rgba(47,44,51,.04), 0 6px 20px rgba(47,44,51,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17161A; --surface:#1F1E23; --surface-2:#28262D; --line:#34323A; --fg:#ECE8EF; --muted:#A39DAA;
  --accent:#9EB9C9; --accent-soft:#26303A; --on-accent:#17161A;
  --pos:#A9C19D; --neg:#D9A3A3; --warn:#D4AE5A; --pos-soft:#232B21; --neg-soft:#332424; --warn-soft:#322B1C;
  --bar:#8DA6B8; --bar-ok:#738FA3; --bar-near:#C9A65A; --bar-over:#B98C8C;
  --chart-in:#93AB88; --chart-out:#8DA6B8; --chart-over:#C29595;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#17161A; --surface:#1F1E23; --surface-2:#28262D; --line:#34323A; --fg:#ECE8EF; --muted:#A39DAA;
  --accent:#9EB9C9; --accent-soft:#26303A; --on-accent:#17161A;
  --pos:#A9C19D; --neg:#D9A3A3; --warn:#D4AE5A; --pos-soft:#232B21; --neg-soft:#332424; --warn-soft:#322B1C;
  --bar:#8DA6B8; --bar-ok:#738FA3; --bar-near:#C9A65A; --bar-over:#B98C8C;
  --chart-in:#93AB88; --chart-out:#8DA6B8; --chart-over:#C29595;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
html{color-scheme:light;-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.auth{max-width:400px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.auth .brand{padding:0;margin-bottom:6px}
.sync{display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.sync.wait i{background:var(--warn)}
.sync.off i{background:var(--neg)}
.side-foot{display:flex;flex-direction:column;gap:6px}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:var(--f-data);font-size:.92em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.1rem;font-weight:700} h3{font-size:.95rem;font-weight:600}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:#FBF7F2;color:#3A3340;display:grid;place-items:center;font-family:'Inter',Arial,sans-serif;font-weight:700;font-size:20px;letter-spacing:-1px;border:1px solid var(--line);line-height:1}
.brand-mark i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#C29595;margin-left:1px;align-self:end;margin-bottom:8px}
.brand-mark{grid-auto-flow:column;align-items:center;justify-content:center}
.brand b{font-family:var(--f-display);font-size:1.05rem}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side-foot{margin-top:auto;padding:0 8px;font-size:.78rem;color:var(--muted)}
.main{min-width:0;padding-block:28px 60px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:1.55rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:.8rem;color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
a.btn{color:inherit;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:var(--surface);border-color:var(--neg)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:1.2rem}
.icon-btn:hover{background:var(--surface-2);color:var(--fg)}
.month-nav{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.month-nav span{min-width:128px;text-align:center;font-weight:600}
.nav-pick{-webkit-appearance:none;appearance:none;border:0;background:transparent;font:inherit;font-weight:600;color:var(--fg);text-align:center;text-align-last:center;padding:6px 18px 6px 8px;min-width:128px;cursor:pointer;border-radius:6px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 9px) 52%,calc(100% - 5px) 52%;background-size:4px 4px,4px 4px;background-repeat:no-repeat}
.nav-pick.year{min-width:84px}
.nav-pick:hover{background-color:var(--surface-2)}
.nav-pick:focus-visible{outline:2px solid var(--accent)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px}
.input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
/* Su iPhone i campi data hanno una larghezza minima propria e sporgono: li allineo agli altri campi */
input.input[type="date"],input.input[type="month"],input.input[type="time"]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;min-height:38px;line-height:1.3;text-align:left;background:var(--surface)}
input.input[type="date"]::-webkit-date-and-time-value{text-align:left;margin:0}
input.input[type="date"]::-webkit-calendar-picker-indicator{opacity:.6}
.field{min-width:0}
.seg{display:flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.neg{background:var(--neg-soft);color:var(--neg)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

.txday{display:flex;justify-content:space-between;padding:12px 4px 6px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:capitalize;border-bottom:1px solid var(--line)}
.tx{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.tx:hover{background:var(--surface-2)}
.icon-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.icon-pick label{cursor:pointer}
.icon-pick input{position:absolute;opacity:0;pointer-events:none}
.icon-pick span{display:grid;place-items:center;height:40px;border-radius:9px;border:1px solid var(--line);color:var(--muted)}
.icon-pick input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.icon-pick input:focus-visible+span{outline:2px solid var(--accent)}
.tx-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:#3A3340}
.tx-main{min-width:0}
.tx-main b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-main small{color:var(--muted);font-size:.8rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-weight:600;text-align:right}
.empty{padding:28px 12px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--bar-ok)}
.bar.over i{background:var(--bar-over)} .bar.near i{background:var(--bar-near)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 0}
.catrow .bar{grid-column:1/-1}
.catname{display:flex;align-items:center;gap:8px;min-width:0}
.catname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

.acc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.acc{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--surface);text-align:left}
.acc:hover{border-color:var(--accent)}
.acc .v{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.acc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

.alloc{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.84rem;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.goal{display:flex;flex-direction:column;gap:10px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

.chart{width:100%;min-height:40px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart-legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}
.chart-legend span{display:inline-flex;gap:6px;align-items:center}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);border:1px solid color-mix(in srgb, var(--warn) 30%, transparent)}
.banner.info{background:var(--accent-soft);border-color:color-mix(in srgb, var(--accent) 30%, transparent)}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .l{display:flex;align-items:center;gap:10px;min-width:0}
.list-row .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh max(16px, env(safe-area-inset-right,0px)) 24px max(16px, env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.sheet.wide{max-width:860px}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet form,.sheet .body{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet footer{display:flex;gap:8px;align-items:center;padding-top:6px;flex-wrap:wrap}
.sheet footer .sp{flex:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-err{color:var(--neg);font-size:.88rem}
.check{display:flex;gap:8px;align-items:center;font-size:.9rem}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:500;max-width:calc(100vw - 32px)}
.toast.err{background:var(--neg);color:#fff}
.fab{display:none}
.more-btn{display:none!important}
.prop-tabs{display:flex;gap:6px;flex-wrap:wrap}
.prop-tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.prop-tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.prop-tab.add{border-style:dashed}
.more-link{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:9px;color:var(--fg);text-decoration:none;font-weight:500}
.more-link svg{width:20px;height:20px;color:var(--muted)}
.more-link:hover,.more-link[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
.form-h{font-family:var(--f-display);font-weight:700;font-size:1rem;padding-top:6px;border-top:1px solid var(--line)}
@media (max-width:760px){ .nav a{flex:1 1 0!important;min-width:0;padding:12px 0!important;justify-content:center;align-items:center} .nav a span{display:none} .nav a svg{width:24px!important;height:24px!important} }
body.locked .side,body.locked .fab{display:none!important}
body.locked .app{grid-template-columns:minmax(0,1fr)}
.skel{color:var(--muted);padding:40px 0;text-align:center}

@media (max-width:980px){
  .g-3-1,.g-2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.k5 .kpi:first-child{grid-column:1/-1}
  .filters{grid-template-columns:1fr 1fr}
  .filters .field:first-child{grid-column:1/-1}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}

// Saldo del conto: se il saldo iniziale ha una data (openingDate), è il saldo a fine di quel giorno:

function balancesNative(upTo) {
  const b = {}, od = {};
  S.accounts.forEach(a => { b[a.id] = +a.openingBalance || 0; od[a.id] = a.openingDate || ''; });
  const apply = (id, delta, date) => {
    if (!id) return;
    if (!(id in b)) { b[id] = 0; od[id] = ''; }
    const D = od[id];
    if (D && date <= D) { if (upTo && date > upTo) b[id] -= delta; return; }
    if (upTo && date > upTo) return;
    b[id] += delta;
  };
  for (const t of S.transactions) {
    if (t.paidBy) continue;
    if (t.kind === 'entrata') apply(t.accountId, valIn(t.accountId, t), t.date);
    else if (t.kind === 'spesa' || t.kind === 'investimento') apply(t.accountId, -valIn(t.accountId, t), t.date);
    else if (t.kind === 'giroconto' || t.kind === 'accantonamento') { apply(t.accountId, -valIn(t.accountId, t), t.date); apply(t.toAccountId, (t.toAmount != null && txCur(t) !== accCur(t.toAccountId) && t.toCurrency === accCur(t.toAccountId) ? +t.toAmount : valIn(t.toAccountId, t)), t.date); }

/* ---------- resoconto annuale vs budget ---------- */
function yearBudget(year) {
  const budgets = S.settings.budgets || {}, yb = S.settings.budgetsYear || {};
  const bIds = S.categories.filter(c => c.kind === 'spesa' && annualBudget(c.id, year) > 0).map(c => c.id);
  const ann = Object.fromEntries(bIds.map(id => [id, annualBudget(id, year)]));
  const monthlyB = bIds.reduce((s, id) => s + ann[id], 0) / 12;
  const today = todayISO(), cy = today.slice(0, 4);
  const elapsed = year < cy ? 12 : year > cy ? 0 : +today.slice(5, 7);
  const monthB = Array.from({ length: 12 }, (_, i) => bIds.reduce((s, id) => s + (+yb[id] > 0 ? +yb[id] / 12 : monthBudget(id, year + '-' + pad(i + 1))), 0));
  const ytdCat = Object.fromEntries(bIds.map(id => { let t = 0; for (let i = 0; i < elapsed; i++) t += +yb[id] > 0 ? +yb[id] / 12 : monthBudget(id, year + '-' + pad(i + 1)); return [id, t]; }));
  const frac = year === cy ? (elapsed - 1) + new Date().getDate() / new Date(+year, elapsed, 0).getDate() : elapsed;
  const byCat = {}, byMonth = Array(12).fill(0);
  let other = 0;
  for (const t of S.transactions) {
    if (!isOut(t) || !String(t.date).startsWith(year)) continue;
    const v = myAmt(t), m = +t.date.slice(5, 7) - 1;
    if (bIds.includes(t.categoryId)) { byCat[t.categoryId] = (byCat[t.categoryId] || 0) + v; byMonth[m] += v; }
    else other += v;
  }
  const spent = sumObj(byCat);
  return { year, budgets, ann, bIds, monthlyB, monthB, ytdCat, elapsed, frac, byCat, byMonth, other, spent, ytdB: sumObj(ytdCat), yearB: monthlyB * 12, proj: frac > 0 ? spent / frac * 12 : 0, isCur: year === cy };
}
// Torta (ciambella) della ripartizione delle spese per categoria
function catDonut(byCat) {
  const tot = sumObj(byCat);
  let rows = Object.entries(byCat).filter(([, v]) => v > 0).sort((a, b) => isOther(cat(a[0]) || {}) - isOther(cat(b[0]) || {}) || b[1] - a[1]).map(([id, v]) => ({ c: cat(id), v }));
  if (!rows.length || !(tot > 0)) return '';
  if (rows.length > 7) { const rest = rows.slice(6).reduce((x, r) => x + r.v, 0); rows = [...rows.slice(0, 6), { c: { name: 'Altre categorie', color: '#DCD8C7' }, v: rest }]; }
  const R = 80, C = 2 * Math.PI * R, gap = rows.length > 1 ? 1.6 : 0;
  let off = 0, arcs = '';
  for (const r of rows) {
    const len = r.v / tot * C;
    arcs += `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${esc(r.c?.color || '#C9CDD6')}" stroke-width="30" stroke-dasharray="${Math.max(0.01, len - gap).toFixed(2)} ${(C - Math.max(0.01, len - gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(r.c?.name || 'Senza categoria')} · ${money(r.v)} (${pctT(r.v / tot)})</title></circle>`;
    off += len;
  }
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 200 200" role="img" aria-label="Ripartizione delle spese per categoria">${arcs}</svg><div class="donut-c"><span class="lbl">Totale</span><span class="v num">${money0(tot)}</span></div></div>
    <div class="donut-leg">${rows.map(r => `<div class="list-row"><div class="l"><i class="dot" style="background:${esc(r.c?.color || '#C9CDD6')}"></i><span>${esc(r.c?.name || 'Senza categoria')}</span></div><span class="num"><span class="muted">${pct(r.v / tot)}</span>&nbsp; ${money0(r.v)}</span></div>`).join('')}</div></div>`;
}

function yearBudgetChart(W, year) {
  const y = yearBudget(year);
  const H = 200, pl = 44, pr = 6, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const max = niceMax(Math.max(1, ...y.monthB.map(v => v * 1.15), ...y.byMonth));
  const bw = iw / 12, w = Math.max(6, Math.min(26, bw * .58));
  const yy = v => pt + ih - ih * v / max;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${yy(v)}" y2="${yy(v)}"/><text x="${pl - 6}" y="${yy(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  y.byMonth.forEach((v, i) => {
    const cx = pl + bw * i + bw / 2, future = i >= y.elapsed;
    const fill = v > y.monthB[i] ? 'var(--chart-over)' : 'var(--chart-out)';
    if (v > 0) g += `<rect x="${cx - w / 2}" y="${yy(v)}" width="${w}" height="${Math.max(0, pt + ih - yy(v))}" rx="2" fill="${fill}" ${future ? 'fill-opacity=".35"' : ''}><title>${MESI[i]} ${year} · Speso ${money(v)} su ${money(y.monthB[i])}</title></rect>`;
    if (W > 420 || i % 2 === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" ${future ? 'style="opacity:.55"' : ''}>${MESI_B[i]}</text>`;
  });
  g += `<path d="${y.monthB.map((b, i) => `${i ? 'L' : 'M'}${(pl + bw * i).toFixed(1)},${yy(b).toFixed(1)}H${(pl + bw * (i + 1)).toFixed(1)}`).join('')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  g += `<text x="${W - pr}" y="${yy(y.monthB[11]) - 6}" text-anchor="end" style="fill:var(--fg);font-weight:600">${money0(y.monthB[11])}/mese</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Spese mensili ${year} rispetto al budget">${g}</svg>`;
}

/* ---------- grafici ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
const kfmt = v => Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('it-IT', { maximumFractionDigits: 1 }) + 'k' : Math.round(v).toLocaleString('it-IT');
function drawCharts() {
  $$('[data-chart]').forEach(el => {
    const W = Math.max(280, el.clientWidth || 600);
    if (el.dataset.chart === 'cashflow') el.innerHTML = cashflowChart(W);
    if (el.dataset.chart === 'networth') el.innerHTML = networthChart(W);
    if (el.dataset.chart === 'yearbudget') el.innerHTML = yearBudgetChart(W, el.dataset.year);
  });
}
function cashflowChart(W) {
  const end = S.ui.month, months = Array.from({ length: 12 }, (_, i) => addMonths(end, i - 11));
  const rows = months.map(m => ({ m, ...monthStats(m) }));
  const H = 220, pl = 44, pr = 6, pt = 10, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const max = niceMax(Math.max(1, ...rows.flatMap(r => [r.inc, r.exp])));
  const bw = iw / rows.length, w = Math.max(3, Math.min(16, bw * .32));
  const y = v => pt + ih - ih * v / max;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  rows.forEach((r, i) => {
    const cx = pl + bw * i + bw / 2;
    g += `<rect x="${cx - w - 1}" y="${y(r.inc)}" width="${w}" height="${Math.max(0, pt + ih - y(r.inc))}" rx="3" fill="var(--chart-in)"><title>${ymLabel(r.m)} · Entrate ${money(r.inc)}</title></rect>`;
    g += `<rect x="${cx + 1}" y="${y(r.exp)}" width="${w}" height="${Math.max(0, pt + ih - y(r.exp))}" rx="3" fill="var(--chart-out)"><title>${ymLabel(r.m)} · Uscite ${money(r.exp)}</title></rect>`;
    if (W > 420 || i % 2 === 1) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" ${r.m === end ? 'style="fill:var(--fg);font-weight:600"' : ''}>${ymShort(r.m)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Entrate e uscite degli ultimi 12 mesi">${g}</svg>`;
}
function networthChart(W) {
  const cur = ymOf(todayISO()), months = Array.from({ length: 12 }, (_, i) => addMonths(cur, i - 11));
  const snaps = [...S.snapshots].sort((a, b) => a.date.localeCompare(b.date));
  const pts = months.map(m => {
    const endD = m === cur ? todayISO() : lastDayOf(m);
    const liq = sumObj(balances(endD));
    let inv;
    if (m === cur) inv = investTotal();
    else { const s = snaps.filter(x => x.date <= endD).pop(); inv = s ? +s.invest || 0 : 0; }
    return { m, liq, nw: liq + inv + receivTotal(endD) };
  });
  const H = 220, pl = 52, pr = 12, pt = 12, pb = 24, iw = W - pl - pr, ih = H - pt - pb;
  const lo0 = Math.min(0, ...pts.map(p => Math.min(p.liq, p.nw)));
  const max = niceMax(Math.max(1, ...pts.map(p => p.nw)) - lo0) + lo0;
  const x = i => pl + iw * i / (pts.length - 1), y = v => pt + ih - ih * (v - lo0) / (max - lo0);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = lo0 + (max - lo0) * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`; }
  const line = k => pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join('');
  g += `<path d="${line('nw')}L${x(pts.length - 1)},${y(lo0)}L${x(0)},${y(lo0)}Z" fill="var(--chart-out)" fill-opacity=".28"/>`;
  g += `<path d="${line('liq')}" fill="none" stroke="var(--chart-in)" stroke-width="2.5" stroke-dasharray="5 4" stroke-linecap="round"/>`;
  g += `<path d="${line('nw')}" fill="none" stroke="var(--bar)" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { if (W > 420 || i % 2 === 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === pts.length - 1 ? 'end' : 'middle'}">${ymShort(p.m)}</text>`; g += `<circle cx="${x(i)}" cy="${y(p.nw)}" r="${i === pts.length - 1 ? 4.5 : 0}" fill="var(--bar)"><title>${ymLabel(p.m)} · ${money(p.nw)}</title></circle>`; });
  const last = pts[pts.length - 1];
  g += `<text x="${x(pts.length - 1) - 8}" y="${y(last.nw) - 10}" text-anchor="end" style="fill:var(--fg);font-weight:600">${money0(last.nw)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Patrimonio netto degli ultimi 12 mesi">${g}</svg>`;
}

  else inner = `<input class="input${f.num ? ' num' : ''}" id="${id}" name="${f.id}" type="${f.type || 'text'}" ${f.num ? 'inputmode="decimal"' : ''} ${f.list ? `list="${f.list}" autocomplete="off"` : ''} value="${esc(f.num && v !== '' ? String(v).replace('.', ',') : v)}" ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.required ? 'required' : ''} autocomplete="off">`;
  return `<div class="field" data-f="${f.id}">${lab}${inner}${f.hint ? `<small class="muted">${esc(f.hint)}</small>` : ''}</div>`;

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 15);
  const cands = [';', ',', '\t', '|'];
  const delim = cands.map(d => [d, lines.reduce((s, l) => s + (l.split(d).length - 1), 0)]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(f); f = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; if (row.some(x => x.trim())) rows.push(row.map(x => x.trim())); row = []; }
    else f += ch;
  }
  row.push(f); if (row.some(x => x.trim())) rows.push(row.map(x => x.trim()));
  return { rows, delim };
}

function impConvert() {
  const data = IMP.rows.slice(IMP.skip + (IMP.header ? 1 : 0));
  const rules = S.settings.rules || [];
  const fallback = kind => catsOf(kind).find(c => /^altr/i.test(c.name))?.id || '';
  const existing = new Set(S.transactions.map(t => t.importKey).filter(Boolean));
  const seen = new Set();
  const out = [];
  let bad = 0, dup = 0;
  for (const r of data) {
    const date = parseDate(r[IMP.map.date]);
    let amt;
    if (IMP.mode === 'single') amt = parseNum(r[IMP.map.amount]);
    else { const d = parseNum(r[IMP.map.debit]), c = parseNum(r[IMP.map.credit]); amt = (isNaN(c) ? 0 : Math.abs(c)) - (isNaN(d) ? 0 : Math.abs(d)); }

function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['Data', 'Tipo', 'Importo', 'Conto', 'Verso conto', 'Categoria', 'Descrizione'].join(';')];
  for (const t of sortTx(S.transactions).reverse()) lines.push([t.date, t.kind, ((t.kind === 'spesa' || t.kind === 'accantonamento') ? -t.amount : +t.amount).toFixed(2).replace('.', ','), q(acc(t.accountId)?.name), q(acc(t.toAccountId)?.name || ''), q(cat(t.categoryId)?.name || ''), q(t.note)].join(';'));
  download(`movimenti-${todayISO()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function backup() {
  download(`bubudex-backup-${todayISO()}.json`, JSON.stringify({ app: 'bilancio', version: 1, exportedAt: new Date().toISOString(), data: snapshotDocs() }, null, 1), 'application/json');
}
function restore(file) {
  const r = new FileReader();
  r.onload = () => {
    let j; try { j = JSON.parse(r.result); } catch (e) { toast('Il file non è un backup valido.', true); return; }
    if (!j || j.app !== 'bilancio' || !j.data) { toast('Il file non è un backup di Bubudex.', true); return; }
    // Le categorie con lo stesso nome e tipo di una tua categoria esistente vengono unite a quella (niente doppioni).
    const norm = x => String(x || '').trim().toLowerCase();
    const remap = {};
    for (const [id, c] of Object.entries(j.data.categories || {})) {
      const ex = S.categories.find(e => norm(e.name) === norm(c.name) && e.kind === c.kind);
      if (ex && ex.id !== id) remap[id] = ex.id;
    }
    const rc = id => remap[id] || id;
    const remapKeys = o => o ? Object.fromEntries(Object.entries(o).map(([k, v]) => [rc(k), v])) : o;
    let n = 0, merged = 0;
    for (const c of [...COLS, 'settings']) for (const [id, d0] of Object.entries(j.data[c] || {})) {
      if (!d0 || typeof d0 !== 'object') continue;
      let d = d0;
      if (c === 'categories') { if (remap[id]) { merged++; continue; } }
      else if (c === 'transactions' || c === 'recurring') { if (d.categoryId) d = { ...d, categoryId: rc(d.categoryId) }; }
      else if (c === 'properties' && d.mortgage && d.mortgage.categoryId) d = { ...d, mortgage: { ...d.mortgage, categoryId: rc(d.mortgage.categoryId) } };
      else if (c === 'settings' && id === 'main') {
        d = { ...S.settings, ...d };
        if (d0.budgets) d.budgets = { ...(S.settings.budgets || {}), ...remapKeys(d0.budgets) };
        if (d0.budgetsYear) d.budgetsYear = { ...(S.settings.budgetsYear || {}), ...remapKeys(d0.budgetsYear) };
        if (d0.budgetsMonth) d.budgetsMonth = { ...(S.settings.budgetsMonth || {}), ...Object.fromEntries(Object.entries(d0.budgetsMonth).map(([ym, b]) => [ym, remapKeys(b)])) };
        if (d0.rules) d.rules = d0.rules.map(r => ({ ...r, c: rc(r.c) }));
      }
      put(c, id, d); n++;
    }
    toast(`Ripristinati ${n} elementi` + (merged ? ` · ${merged} categorie unite alle tue` : ''));
  };
  r.readAsText(file);
}

  COLS.forEach(c => S[c].filter(x => x.demo).forEach(x => del(c, x.id)));

async function googleLogin() {
  const err = $('#g-err'); if (err) err.hidden = true;
  const prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  try { await firebase.auth().signInWithPopup(prov); }
  catch (e) {
    const c = String(e.code || '');
    if (c.includes('popup-closed') || c.includes('cancelled-popup')) return;
    const tip = 'Sul telefono usa "Accedi con email e password": la password la imposti una volta dal computer in Impostazioni → Account.';
    if (err) {
      err.textContent = c.includes('unauthorized-domain') ? 'Questo indirizzo non è autorizzato: in Firebase aggiungi hyf0515.github.io in Authentication → Impostazioni → Domini autorizzati.'
        : c.includes('operation-not-allowed') ? 'L\'accesso con Google non è attivo: abilitalo in Firebase → Authentication → Metodo di accesso.'
        : c.includes('popup-blocked') || c.includes('operation-not-supported') || c.includes('web-storage') ? 'Il browser ha bloccato la finestra di Google. ' + tip
        : 'Accesso con Google non riuscito. ' + tip;
      err.hidden = false;
    }
    const f = $('#auth-form'), b = $('[data-act="email-login"]'); if (f) f.hidden = false; if (b) b.hidden = true;
  }
}
async function setPassword() {
  const u = firebase.auth().currentUser; if (!u) return;
  const hasPwd = u.providerData.some(p => p.providerId === 'password');
  openForm({
    title: hasPwd ? 'Cambia la password' : 'Password per il telefono',
    intro: `<p class="muted" style="margin:0;font-size:.88rem">Sul telefono (soprattutto iPhone) l'accesso con Google può essere bloccato. Imposta una password per questo stesso account: sul telefono scegli <b>"Accedi con email e password"</b> con <b>${esc(u.email || '')}</b> e ritrovi tutti i tuoi dati.</p>`,
    fields: [{ id: 'p1', label: 'Nuova password (almeno 8 caratteri)', type: 'password' }, { id: 'p2', label: 'Ripeti la password', type: 'password' }],
    validate: v => v.p1.length < 8 ? 'Usa almeno 8 caratteri.' : v.p1 !== v.p2 ? 'Le due password non coincidono.' : '',
    async onSubmit(v) {
      const run = () => hasPwd ? u.updatePassword(v.p1) : u.linkWithCredential(firebase.auth.EmailAuthProvider.credential(u.email, v.p1));
      try { await run(); }
      catch (e) {
        const c = String(e.code || '');
        if (c.includes('requires-recent-login')) { try { await u.reauthenticateWithPopup(new firebase.auth.GoogleAuthProvider()); await run(); } catch (e2) { toast('Conferma non riuscita: ' + (e2.message || e2.code), true); return false; } }
        else if (c.includes('operation-not-allowed')) { toast('Attiva prima "Email/password" in Firebase → Authentication → Metodo di accesso.', true); return false; }
        else if (c.includes('weak-password')) { toast('Password troppo debole: usane una più lunga.', true); return false; }
        else { toast('Non riuscito: ' + (e.message || c), true); return false; }
      }
      toast('Password impostata: ora puoi accedere anche dal telefono'); schedule(); return true;
    }
  });
}
async function authSubmit(mode) {
  const email = $('#au-email').value.trim(), pass = $('#au-pass').value, err = $('#au-err'), msg = $('#au-msg');
  err.hidden = true; msg.hidden = true;
  if (!email || !pass) { err.textContent = 'Inserisci email e password.'; err.hidden = false; return; }
  if (mode === 'signup' && pass.length < 8) { err.textContent = 'Scegli una password di almeno 8 caratteri.'; err.hidden = false; return; }
  $$('#auth-form button').forEach(b => b.disabled = true);
  try {
    if (mode === 'signup') await firebase.auth().createUserWithEmailAndPassword(email, pass);
    else await firebase.auth().signInWithEmailAndPassword(email, pass);
  } catch (e) {
    const c = String(e.code || '');
    err.textContent = /wrong-password|user-not-found|invalid-credential|invalid-login/.test(c) ? 'Email o password non corretti.' : c.includes('email-already-in-use') ? 'Esiste già un account con questa email: usa Accedi.' : c.includes('operation-not-allowed') ? 'L\'accesso con email non è attivo in Firebase (Authentication → Metodo di accesso).' : c.includes('admin-restricted') ? 'La registrazione di nuovi account è disattivata.' : c.includes('network') ? 'Nessuna connessione a internet.' : (e.message || c);
    err.hidden = false;
  } finally { $$('#auth-form button').forEach(b => b.disabled = false); }
}
async function resetPass() {
  const email = $('#au-email')?.value.trim(), msg = $('#au-msg'), err = $('#au-err');
  if (!email) { err.textContent = 'Scrivi la tua email, poi premi di nuovo "Password dimenticata".'; err.hidden = false; return; }
  try { await firebase.auth().sendPasswordResetEmail(email); msg.textContent = 'Ti ho inviato un\'email per reimpostare la password.'; msg.hidden = false; err.hidden = true; }
  catch (e) { err.textContent = e.message || 'Invio non riuscito.'; err.hidden = false; }
}
async function logout(btn) {
  if (pendingWrites && !btn.classList.contains('armed')) { btn.classList.add('armed'); btn.textContent = 'Ci sono modifiche non ancora inviate: esci comunque'; return; }
  unsubs.forEach(u => u()); unsubs = [];
  try { await firebase.auth().signOut(); } catch (e) {}
  try { await S.fs.terminate(); await S.fs.clearPersistence(); } catch (e) {}
  LS.del('bubudex.fx');
  location.hash = ''; location.reload();
}
function startSession(user) {
  if (S.user && S.user.id === user.uid) return;
  S.user = { id: user.uid, email: user.email || user.displayName || '' };
  S.status = 'ok'; render(); updateSync();
  listen();
}

/* ---------- avvio ---------- */
async function boot() {
  const cfg = getConfig();
  if (!window.firebase || !firebase.initializeApp) { $('#view').innerHTML = `<div class="panel empty"><h2>Impossibile avviare l'app</h2><p>La libreria di Firebase non è stata caricata. Controlla la connessione e ricarica.</p></div>`; return; }
  if (!cfg.apiKey || !cfg.projectId) { S.status = 'setup'; render(); return; }
  const { fromFile, ...conf } = cfg;
  firebase.initializeApp(conf);
  S.fs = firebase.firestore();
  try { await S.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* un'altra scheda la usa già o il browser non la supporta */ }
  let first = true;
  firebase.auth().onAuthStateChanged(user => {
    if (user) startSession(user);
    else { if (S.user) { location.reload(); return; } S.status = 'auth'; render(); }
    first = false;
  });
}
// Aggiornamenti automatici: controllo una nuova versione all'apertura e ogni volta che l'app torna in primo piano;
// quando arriva, ricarico la pagina (aspettando che non ci sia un modulo aperto, per non perdere quello che stai scrivendo).
let swReg = null;
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    swReg = reg;
    const check = () => reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
    window.addEventListener('focus', check);
    setInterval(check, 30 * 60e3);
  }).catch(() => {});
  let reloading = false; const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading || !hadController) return;
    const go = () => { if (reloading) return; if ($('#modal') && !$('#modal').hidden) { setTimeout(go, 2000); return; } reloading = true; location.reload(); };
    go();
  });
}
async function checkUpdate(btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Controllo…'; }
  try { if (swReg) await swReg.update(); } catch (e) {}
  setTimeout(() => location.reload(), 600);
}
document.body.classList.toggle('hide-summary', hideSummary);
document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => { if (innerWidth <= 760) e.preventDefault(); }, { passive: false });
boot();
})();
